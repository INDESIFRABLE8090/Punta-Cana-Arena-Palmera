name: Arena & Palmera browser review (one-shot, private)

on:
  push:
    branches: [chatgpt/arena-build-baseline-r1]
    paths:
      - '.github/workflows/arena-browser-review-once.yml'

permissions:
  contents: read

jobs:
  local-browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unpack source and prepare local-only preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arena"
          base64 --decode project-source.zip.b64 > "$RUNNER_TEMP/arena/source.zip"
          unzip -tq "$RUNNER_TEMP/arena/source.zip"
          unzip -q "$RUNNER_TEMP/arena/source.zip" -d "$RUNNER_TEMP/arena"
          cd "$RUNNER_TEMP/arena/punta-cana-arena-palmera"
          npm install --no-audit --no-fund --ignore-scripts
          npm install --no-save --no-audit --no-fund --ignore-scripts playwright-core
          npm run build
          (npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/arena/preview.log" 2>&1 &)
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ -o /dev/null
      - name: Browser screenshots and functional overview (no publish, no external actions)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/arena/punta-cana-arena-palmera"
          mkdir -p "$RUNNER_TEMP/arena/browser-review"
          cat > browser-audit.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';
          import path from 'node:path';

          const candidates = ['/usr/bin/google-chrome', '/usr/bin/google-chrome-stable', '/usr/bin/chromium', '/usr/bin/chromium-browser'];
          const executablePath = candidates.find(x => fs.existsSync(x));
          if (!executablePath) throw new Error('Runner Chrome missing: ' + candidates.join(', '));
          const browser = await chromium.launch({ executablePath, headless: true, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
          const results = [];
          const dest = process.env.RUNNER_TEMP + '/arena/browser-review';
          for (const [label, width, height] of [['mobile',390,844],['tablet',768,1024],['desktop',1440,900]]) {
            const page = await browser.newPage({ viewport:{width,height}, deviceScaleFactor:1, reducedMotion:'reduce' });
            const errors = [], failedRequests = [];
            page.on('pageerror', e => errors.push(('pageerror: '+e.message).slice(0,240)));
            page.on('console', m => {if (m.type() === 'error') errors.push(('console: '+m.text()).slice(0,240));});
            page.on('requestfailed', req => failedRequests.push(req.url().slice(0,210)+' '+(req.failure()?.errorText||'')));
            const response = await page.goto('http://127.0.0.1:4173/', {waitUntil:'domcontentloaded', timeout:25000});
            await page.waitForTimeout(1700);
            const info = await page.evaluate(() => ({
              title: document.title,
              h1: [...document.querySelectorAll('h1')].map(e=>e.innerText.trim()).slice(0,8),
              headings: [...document.querySelectorAll('h2')].map(e=>e.innerText.trim()).slice(0,12),
              callsToAction: [...document.querySelectorAll('a,button')].filter(e=>{
                const s=getComputedStyle(e), r=e.getBoundingClientRect();
                return s.visibility!=='hidden'&&s.display!=='none'&&r.width>0&&r.height>0;
              }).map(e=>({text:e.innerText.trim().slice(0,70),href:e.getAttribute('href')})).filter(x=>x.text).slice(0,32),
              images: document.querySelectorAll('img').length,
              unloadedImages: [...document.images].filter(e=>!e.complete||e.naturalWidth===0).length,
              videos:document.querySelectorAll('video').length,
              canvases:document.querySelectorAll('canvas').length,
              documentWidth:document.documentElement.scrollWidth,
              viewportWidth:window.innerWidth,
              anchorTargetsMissing: [...document.querySelectorAll('a[href^="#"]')].filter(e=>e.getAttribute('href').length>1&&!document.getElementById(e.getAttribute('href').slice(1))).map(e=>e.getAttribute('href')).slice(0,20),
              bodyText:document.body.innerText.replace(/\s+/g,' ').slice(0,1700)
            }));
            await page.screenshot({path:path.join(dest,label+'-'+width+'.png'),fullPage:true,animations:'disabled',timeout:25000});
            results.push({viewport:label,width,height,status:response?.status(),...info,horizontalOverflow:info.documentWidth>width+2,errors,failedRequests});
            await page.close();
          }
          await browser.close();
          fs.writeFileSync(path.join(dest,'audit.json'), JSON.stringify(results,null,2));
          console.log('ARENA_AUDIT_JSON_START');
          console.log(JSON.stringify(results,null,2));
          console.log('ARENA_AUDIT_JSON_END');
          JS
          node browser-audit.mjs
      - name: Upload private viewport screenshots and audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-palmera-browser-review
          path: ${{ runner.temp }}/arena/browser-review/
          if-no-files-found: warn
          retention-days: 3
