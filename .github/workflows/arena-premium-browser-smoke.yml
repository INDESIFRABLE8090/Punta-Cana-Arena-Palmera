name: arena-premium-browser-smoke
on:
  push:
    branches:
      - qa/arena-premium-build-proof-20261122
    paths:
      - tests/browser-smoke.mjs
      - .github/workflows/arena-premium-browser-smoke.yml
      - src/**
      - astro.config.mjs
      - package-lock.json
  pull_request:
    paths:
      - tests/browser-smoke.mjs
      - .github/workflows/arena-premium-browser-smoke.yml
      - src/**
      - astro.config.mjs
      - package-lock.json
permissions:
  contents: read
concurrency:
  group: arena-browser-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      SITE_URL: https://indesifrable8090.github.io
      BASE_PATH: /Punta-Cana-Arena-Palmera
      NODE_OPTIONS: --max-old-space-size=4096
      CI: 'true'
      JARVIS_SMOKE_DEV: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies from lockfile
        run: npm ci --no-audit --no-fund
      # Production build is verified in arena-premium-build-qa.yml.
      # This independent browser smoke uses the dev server to avoid rebuilding 324 images.
      - name: Install isolated Chromium smoke runner
        run: |
          npm install --global --no-audit --no-fund playwright@1.57.0
          playwright install --with-deps chromium
      - name: Run mobile, desktop and locale smoke in Chromium
        run: |
          node --check tests/browser-smoke.mjs
          node tests/browser-smoke.mjs
