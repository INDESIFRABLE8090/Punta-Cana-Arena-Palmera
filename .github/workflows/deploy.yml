name: Deploy Vite site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore website source
        run: |
          base64 --decode project-source.zip.b64 > /tmp/project.zip
          mkdir -p site
          unzip -q /tmp/project.zip -d site
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: site/punta-cana-arena-palmera
        run: npm install --no-audit --no-fund
      - name: Build website
        working-directory: site/punta-cana-arena-palmera
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/punta-cana-arena-palmera/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
