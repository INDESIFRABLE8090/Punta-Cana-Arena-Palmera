name: Arena & Palmera premium trip planner QA (one shot)

on:
  push:
    branches: [chatgpt/arena-premium-planner-r1]
    paths: ['.github/workflows/arena-premium-planner-once.yml']

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build site and verify QR library
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --ignore-scripts
          npm install --no-save --no-audit --no-fund --ignore-scripts playwright-core
          npm run build
          test -s dist/index.html
          test -s dist/config.js
          node --input-type=module -e "import QRCode from 'qrcode'; const x = await QRCode.toDataURL('https://example.com/?plan=saona%3A1',{width:128}); if(!x.startsWith('data:image/png;base64,')) throw Error('QR failed'); console.log('QR image generated successfully');"
          (npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &)
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:4173/ -o /dev/null; then break; fi; sleep 1; done
          curl -fsS http://127.0.0.1:4173/config.js -o /dev/null
      - name: Browser test for 390/768/1440 and multi-tour quote (never send)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arena-premium"
          cat > test-premium.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';
          import path from 'node:path';
          const chrome=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(p=>fs.existsSync(p));
          if(!chrome) throw new Error('Chrome missing');
          const browser=await chromium.launch({executablePath:chrome,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const results=[];
          for(const [name,width,height] of [['mobile',390,844],['tablet',768,1024],['desktop',1440,900]]){
            const page=await browser.newPage({viewport:{width,height},reducedMotion:'reduce'});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('response',r=>{if(r.status()>=400)errors.push(r.status()+' '+r.url());});
            await page.addInitScript(()=>{window.open=(url)=>{window.__testGeneratedQuote=url;return null;};});
            await page.goto('http://127.0.0.1:4173/?plan=unknown:1,saona:2,saona:3,catalina:1',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(900);
            const all=await page.locator('#tourGrid .tour-card').count();
            const chosen=await page.locator('#plannerList .planner-item').count();
            const days=await page.locator('[data-plan-day]').evaluateAll(nodes=>nodes.map(n=>n.value));
            const state=await page.evaluate(()=>({overflow:document.documentElement.scrollWidth>innerWidth+2,config:!!window.BRAND_CONFIG?.whatsappNumber}));
            if(all!==11||chosen!==2||days.join(',')!=='1,2'||state.overflow||!state.config)throw Error(name+' initial '+JSON.stringify({all,chosen,days,state}));
            await page.screenshot({path:path.join(process.env.RUNNER_TEMP,'arena-premium',name+'-'+width+'.png'),fullPage:true,animations:'disabled'});
            let functional=null;
            if(name==='desktop'){
              await page.locator('[data-save-tour="buggies"]').click();
              if((await page.locator('#plannerList .planner-item').count())!==3)throw Error('add failed');
              await page.locator('[data-plan-day="buggies"]').selectOption('3');
              await page.reload({waitUntil:'domcontentloaded'});
              const persisted=await page.locator('[data-plan-day="buggies"]').inputValue();
              if(persisted!=='3')throw Error('storage failed: '+persisted);
              await page.locator('#languageToggle').click();
              const heading=await page.locator('[data-planner-i18n="title"]').innerText();
              if(!heading.includes('Caribbean'))throw Error('locale: '+heading);
              await page.locator('#plannerQuote').click();
              await page.locator('input[name="name"]').fill('Test visitor');
              await page.locator('input[name="contact"]').fill('qa@example.invalid');
              await page.locator('.consent input[type="checkbox"]').check();
              await page.locator('#quoteForm button[type="submit"]').click();
              await page.waitForTimeout(250);
              const raw=await page.evaluate(()=>window.__testGeneratedQuote || '');
              const quote=raw?new URL(raw).searchParams.get('text'):'';
              if(!quote||!quote.includes('Day 1: Catalina')||!quote.includes('Day 2: Saona')||!quote.includes('Day 3: Buggies')||!quote.includes('operator confirmation'))throw Error('combined quote invalid: '+String(quote).slice(0,500));
              if(await page.locator('#plannerShare').isEnabled())throw Error('localhost sharing should be disabled');
              functional={savedDay:persisted,bilingual:true,combinedQuote:true,noExternalSend:true};
            }
            if(errors.length)throw Error(name+' runtime errors '+JSON.stringify(errors));
            results.push({name,width,height,all,chosen,overflow:false,httpErrors:0,...functional});
            await page.close();
          }
          await browser.close();
          fs.writeFileSync(process.env.RUNNER_TEMP+'/arena-premium/premium-qa.json',JSON.stringify(results,null,2));
          console.log('PREMIUM_QA_RESULT:'+JSON.stringify(results));
          JS
          node test-premium.mjs
      - name: Save private screenshots and test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-premium-itinerary-qa
          path: ${{ runner.temp }}/arena-premium/
          retention-days: 3
          if-no-files-found: warn
