name: Arena & Palmera restore editable website from archived source (one-shot)

on:
  push:
    branches: [chatgpt/arena-build-baseline-r1]
    paths:
      - '.github/workflows/arena-unpack-source-once.yml'

permissions:
  contents: write

jobs:
  unpack-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore only allowlisted editable website files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arena-unpack"
          base64 --decode project-source.zip.b64 > "$RUNNER_TEMP/arena-unpack/source.zip"
          unzip -tq "$RUNNER_TEMP/arena-unpack/source.zip"
          unzip -q "$RUNNER_TEMP/arena-unpack/source.zip" -d "$RUNNER_TEMP/arena-unpack"
          SRC="$RUNNER_TEMP/arena-unpack/punta-cana-arena-palmera"
          for name in index.html app.js styles.css assets/favicon.svg; do
            test -f "$SRC/$name"
            install -D -m 644 "$SRC/$name" "$name"
          done
          test -f config.js
          install -D -m 644 config.js public/config.js
          echo "RESTORED EDITABLE FILES:"
          git status --short
      - name: Build and check commercial config is included
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --ignore-scripts
          npm run build
          test -s dist/index.html
          test -s dist/config.js
          grep -q 'BRAND_CONFIG' dist/config.js
          echo 'VERIFIED: dist/config.js and dist/index.html exist'
          (npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/arena-preview.log" 2>&1 &)
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:4173/config.js -o "$RUNNER_TEMP/config-received.js"; then break; fi
            sleep 1
          done
          cmp dist/config.js "$RUNNER_TEMP/config-received.js"
          echo 'VERIFIED: local web server returns config.js (HTTP 200), exact dist file'
      - name: Commit recovered source only on review branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'chatgpt/arena-build-baseline-r1'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html app.js styles.css assets/favicon.svg public/config.js
          git diff --cached --check
          git diff --cached --quiet && { echo 'Already recovered'; exit 0; }
          git commit -m "Recover editable Arena source and include runtime brand config in Vite build"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
