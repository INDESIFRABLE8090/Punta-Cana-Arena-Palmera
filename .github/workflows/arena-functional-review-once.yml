name: Arena & Palmera private functional review (one-shot)

on:
  push:
    branches: [chatgpt/arena-build-baseline-r1]
    paths:
      - '.github/workflows/arena-functional-review-once.yml'

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build editable checkout
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --ignore-scripts
          npm install --no-save --no-audit --no-fund --ignore-scripts playwright-core
          npm run build
          test -s dist/config.js
          (npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/arena-qa-server.log" 2>&1 &)
          for i in $(seq 1 25); do if curl -fsS http://127.0.0.1:4173/config.js -o /dev/null; then break; fi; sleep 1; done
          curl -fsS http://127.0.0.1:4173/config.js -o /dev/null
      - name: Interactions in Chrome, no real messages sent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arena-qa"
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import fs from 'node:fs';
          import path from 'node:path';
          const chrome=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(p=>fs.existsSync(p));
          if(!chrome) throw new Error('Chrome executable missing in runner');
          const browser=await chromium.launch({executablePath:chrome,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const records=[];const issues=[];
          const dir=process.env.RUNNER_TEMP+'/arena-qa';
          for(const [label,w,h] of [['mobile',390,844],['desktop',1440,900]]){
            const page=await browser.newPage({viewport:{width:w,height:h},reducedMotion:'reduce'});
            await page.addInitScript(()=>{window.open=(url)=>{window.__QA_BLOCKED_EXTERNAL_LINK=url;return null;};});
            const errors=[];const missing=[];
            page.on('pageerror',e=>errors.push(e.message.slice(0,170)));
            page.on('response',r=>{if(r.status()>=400)missing.push({url:r.url().replace(/\?.*/,''),status:r.status()});});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(1200);
            const configured=await page.evaluate(()=>Boolean(window.BRAND_CONFIG?.whatsappNumber));
            const all=await page.locator('#tourGrid .tour-card').count();
            const noOverflow=await page.evaluate(()=>document.documentElement.scrollWidth <= innerWidth+2);
            await page.screenshot({path:path.join(dir,label+'-fixed.png'),fullPage:true,animations:'disabled'});
            let sea=null,modal=false,language=false,quote=false;
            if(label==='desktop'){
              await page.locator('[data-filter="sea"]').click();
              sea=await page.locator('#tourGrid .tour-card').count();
              const first=page.locator('#tourGrid [data-tour]').first();
              await first.click({timeout:10000});
              modal=await page.locator('#tourModal.show').count()===1;
              await page.locator('#modalClose').click();
              const oldHeading=await page.locator('h1').innerText();
              await page.locator('#languageToggle').click();
              language=(await page.locator('h1').innerText())!==oldHeading;
              await page.locator('#experienceSelect').selectOption({index:1});
              await page.locator('input[name="name"]').fill('Demo QA');
              await page.locator('input[name="contact"]').fill('qa@example.invalid');
              await page.locator('.consent input[type="checkbox"]').check();
              await page.locator('#quoteForm button[type="submit"]').click();
              await page.waitForTimeout(180);
              quote=await page.evaluate(()=>window.__QA_BLOCKED_EXTERNAL_LINK?.startsWith('https://wa.me/')===true);
            }
            const rec={viewport:label,width:w,httpStatus:200,configLoaded:configured,tourCards:all,seaFilterCount:sea,modalOpens:modal,languageSwitches:language,quoteGeneratesWhatsAppWithoutSending:quote,noHorizontalOverflow:noOverflow,pageErrors:errors,httpErrors:missing};
            records.push(rec);
            if(!configured||!noOverflow||all===0||errors.length||missing.length)issues.push({viewport:label,problem:'startup'});
            if(label==='desktop'&&(!(sea>0&&sea<all)||!modal||!language||!quote))issues.push({viewport:label,problem:'interaction'});
            await page.close();
          }
          await browser.close();
          fs.writeFileSync(path.join(dir,'results.json'),JSON.stringify({records,issues},null,2));
          console.log('ARENA_QA_RESULT:'+JSON.stringify({records,issues}));
          if(issues.length)process.exitCode=1;
          JS
          node qa.mjs
      - name: Preserve screenshots and test findings for private review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-palmera-fixed-preview-and-qa
          path: ${{ runner.temp }}/arena-qa/
          if-no-files-found: warn
          retention-days: 3
