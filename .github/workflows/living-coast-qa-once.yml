name: Living Coast 2026 — one-shot visual QA

on:
  push:
    branches: [chatgpt/arena-cinematic-direction-2026]
    paths: ['.github/workflows/living-coast-qa-once.yml']

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and locally preview the site
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --ignore-scripts
          npm install --no-save --no-audit --no-fund --ignore-scripts playwright-core
          npm run build
          test -s dist/config.js
          (npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &)
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/config.js -o /dev/null
      - name: Chrome 390 / 768 / 1440, sea-land-night, language and low-motion fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/coast"
          cat > check.mjs <<'JS'
          import {chromium} from 'playwright-core';
          import fs from 'node:fs';
          import path from 'node:path';
          const bin=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(p=>fs.existsSync(p));
          if(!bin)throw Error('Chrome unavailable');
          const browser=await chromium.launch({executablePath:bin,headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--enable-unsafe-swiftshader']});
          const audits=[];
          for(const [label,width,height] of [['phone',390,844],['tablet',768,1024],['desktop',1440,900]]){
            const page=await browser.newPage({viewport:{width,height},reducedMotion:'no-preference'});
            page.setDefaultTimeout(9500);
            const errors=[],bad=[];
            page.on('pageerror',e=>errors.push(e.message.slice(0,150)));
            page.on('response',r=>{if(r.status()>=400)bad.push(r.status()+' '+r.url());});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(1000);
            const state=await page.evaluate(()=>({
              title:document.querySelector('h1')?.innerText,
              ready:document.querySelector('.hero')?.getBoundingClientRect().height>600,
              gl:document.querySelector('#livingCoastCanvas')?.classList.contains('coast-ready'),
              staticFallback:getComputedStyle(document.querySelector('.living-coast-stage')).backgroundImage!=='none',
              tours:document.querySelectorAll('#tourGrid .tour-card').length,
              noOverflow:document.documentElement.scrollWidth<=innerWidth+2,
              controls:document.querySelectorAll('[data-coast-chapter]').length
            }));
            if(!state.ready||!state.staticFallback||state.tours!==11||!state.noOverflow||state.controls!==3)throw Error(label+' layout '+JSON.stringify(state));
            await page.screenshot({path:path.join(process.env.RUNNER_TEMP,'coast',label+'-'+width+'.png'),animations:'disabled'});
            if(label==='desktop'){
              for(const [id,expected] of [['night',1],['adventure',2],['sea',6]]){
                await page.locator('[data-coast-chapter="'+id+'"]').click();
                const chosen=await page.locator('.coast-chapter[aria-pressed="true"]').getAttribute('data-coast-chapter');
                const count=await page.locator('#tourGrid .tour-card').count();
                if(chosen!==id||count!==expected)throw Error('chapter '+id+' '+chosen+' '+count);
              }
              await page.locator('#languageToggle').click();
              const english=(await page.locator('h1').innerText()).toLowerCase();
              if(!english.includes('the caribbean'))throw Error('language change failed: '+english);
              await page.locator('#tourGrid [data-save-tour="saona"]').click();
              if(await page.locator('#plannerList .planner-item').count()!==1)throw Error('planner regression');
              state.chapters='pass';state.language='pass';state.planner='pass';
            }
            if(errors.length||bad.length)throw Error(label+' page '+JSON.stringify({errors,bad}));
            audits.push({label,width,height,...state});
            await page.close();
          }
          const p=await browser.newPage({viewport:{width:390,height:844},reducedMotion:'reduce'});
          await p.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
          const safe=await p.evaluate(()=>({
            static:getComputedStyle(document.querySelector('.living-coast-stage')).backgroundImage!=='none',
            webgl:document.querySelector('#livingCoastCanvas').classList.contains('coast-ready'),
            animation:getComputedStyle(document.querySelector('h1 .cinematic-line')).animationName
          }));
          if(!safe.static||safe.webgl||safe.animation!=='none')throw Error('motion fallback '+JSON.stringify(safe));
          await p.screenshot({path:path.join(process.env.RUNNER_TEMP,'coast','reduced-motion.png')});
          await p.close();await browser.close();
          audits.push({label:'reduced-motion',...safe});
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'coast','audit.json'),JSON.stringify(audits,null,2));
          console.log('COAST_QA_RESULTS:'+JSON.stringify(audits));
          JS
          node check.mjs
      - name: Save private screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-coast-private-screenshots
          path: ${{ runner.temp }}/coast/
          retention-days: 3
          if-no-files-found: warn
